bot:
  name: XAUUSD_RULE_BASED_BOT
  mode: PAPER
  scan_interval_seconds: 5
  position_monitor_interval_seconds: 2
symbol:
  base_symbol: XAUUSD
  auto_detect_alias: true
  allowed_aliases: [XAUUSD, XAUUSDm, XAUUSD.a, XAUUSD.pro, GOLD]
timeframes:
  trend: [H4, H1]
  setup: M15
  entry: M5
  candle_history: 500
strategy:
  type: TREND_PULLBACK
  require_h4_h1_alignment: false
  minimum_signal_score: 60
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_period: 14
  rsi_buy_min: 40
  rsi_buy_max: 72
  rsi_sell_min: 28
  rsi_sell_max: 60
  atr_period: 14
  adx_period: 14
  minimum_adx: 15
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  swing_window: 5
  pullback_tolerance_atr: 0.55
signal_scoring:
  h4_trend_alignment: 20
  h1_trend_alignment: 15
  ema_alignment: 10
  market_structure: 10
  pullback_quality: 15
  candle_confirmation: 10
  macd_confirmation: 5
  rsi_confirmation: 5
  adx_strength: 5
  risk_reward_quality: 5
position_control:
  max_open_positions: 7
  max_buy_positions: 7
  max_sell_positions: 7
  allow_opposite_positions: false
  auto_refill_empty_slots: true
  entry_cooldown_minutes: 10
  minimum_entry_distance_atr: 0.4
  prohibit_adding_to_losing_basket: true
risk:
  risk_per_entry_percent: 0.25
  max_basket_risk_percent: 1.25
  max_total_lot: 0.10
  minimum_free_margin_percent: 40
hard_trade:
  enabled: false
  minimum_setup_win_rate: 70.0
  m5_minimum_setup_win_rate: 80.0
  max_lot_per_entry: 0.03
  max_open_positions: 7
  max_add_entry_distance_atr: 1.0
  max_losing_basket_add_usd: 2.0
  allow_fast_scalp: false
  scan_interval_seconds: 1.0
  position_monitor_interval_seconds: 1.0
  preferred_setup_timeframe: M30
  preferred_entry_timeframe: M15
  emergency_exit_on_restart: true
  emergency_exit_max_loss_usd: 8.0
  emergency_exit_max_adverse_r: 0.8
  btc_weekend_relaxation_enabled: true
  btc_weekend_signal_score_discount: 5
  btc_weekend_setup_win_rate_discount: 5.0
  btc_weekend_max_atr_multiplier_discount: 1.0
m15_quick_trade:
  enabled: true
  minimum_signal_score: 75
  minimum_setup_win_rate: 62.0
  minimum_adx: 18.0
  max_body_atr: 1.8
  min_body_atr: 0.35
  max_lot_per_entry: 0.01
  risk_per_entry_percent: 0.12
  minimum_lot_max_risk_percent: 0.18
  require_profit_factor_gate: true
recovery_mode:
  enabled: true
  trigger_basket_position_count: 7
  soft_minimum_setup_win_rate: 62.0
  hard_minimum_setup_win_rate: 70.0
  soft_minimum_loss_usd: 4.0
  soft_maximum_loss_usd: 6.0
  hard_minimum_loss_usd: 8.0
  soft_recovered_ratio: 0.5
  normal_recovered_ratio: 1.0
stop_loss:
  method: SWING_ATR
  atr_buffer_multiplier: 0.3
  minimum_atr_multiplier: 1.0
  maximum_atr_multiplier: 2.5
  relaxed_forex_maximum_atr_multiplier: 10.0
  relaxed_forex_minimum_signal_score: 85
take_profit:
  method: RISK_REWARD
  minimum_risk_reward: 1.8
  default_risk_reward: 2.0
basket_take_profit:
  enabled: true
  mode: FIXED_USD
  target_r_multiple: 1.5
  target_fixed_usd: 8
  fast_target_fixed_usd: 2
  target_equity_percent: 1.0
basket_stop_loss:
  enabled: true
  mode: FIXED_USD
  maximum_loss_percent: 1.25
  maximum_loss_usd: 8
  hard_max_loss_usd: 8
break_even:
  enabled: true
  trigger_r_multiple: 0.5
  lock_profit_points: 20
  apply_once: true
trailing_stop:
  enabled: true
  activation_r_multiple: 0.8
  method: ATR
  atr_multiplier: 1.5
  update_step_points: 20
partial_close:
  enabled: true
  levels:
    - {trigger_r: 1.0, close_percent: 40}
    - {trigger_r: 1.5, close_percent: 30}
profit_protection:
  enabled: true
  minimum_peak_profit_usd: 5.0
  giveback_percent: 45.0
  hard_peak_profit_usd: 6.0
  hard_floor_profit_usd: 3.0
  require_break_even_applied: true
spread_guard:
  enabled: true
  maximum_spread_points: 80
  maximum_spread_atr_ratio: 0.08
daily_risk:
  max_daily_loss_percent: 2.0
  daily_profit_target_percent: 1.5
  max_consecutive_losses: 3
  pause_until_next_day: true
cooldown:
  enabled: true
  after_take_profit_minutes: 30
  after_stop_loss_minutes: 20
  after_manual_close_minutes: 30
  after_trend_reversal_minutes: 60
session:
  timezone: UTC
  allowed_days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
  allowed_sessions:
    - {start: "07:00", end: "20:00"}
  avoid_rollover: {enabled: true, start: "21:45", end: "22:15"}
  close_before_weekend: {enabled: true, friday_close_time: "19:30"}
execution:
  deviation_points: 30
  maximum_retries: 2
  retry_delay_seconds: 1
  reject_if_price_changed_points: 50
broker:
  magic_number: 26071701
  order_comment_prefix: XAU_RULE_BOT
  server_time_offset_hours: 3
data_retention:
  closed_trade_retention_days: 90
  rejected_signal_retention_days: 3
  indicator_snapshot_retention_days: 3
  auxiliary_file_retention_days: 2
  auxiliary_file_max_mb: 2
  backup_retention_days: 7
  log_file_max_mb: 20
  max_project_storage_mb: 3072
  cleanup_interval_seconds: 3600
backtest:
  initial_equity: 10000
  simulated_spread_points: 30
  slippage_points: 5
  commission_per_lot: 7
